[package]
name = "xtask"
description = "Development tooling: synthetic archive fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# Writers exist only in this development tool and in tests.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs", "aes-crypto"] }
rars = { version = "0.11", default-features = false, features = ["write", "encryption"] }
sevenz-rust = { version = "0.6.1", default-features = false, features = ["compress"] }
