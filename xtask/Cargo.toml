[package]
name = "xtask"
description = "Development tooling: fixtures, the local gate, the corpus and releases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
# Writers exist only in this development tool and in tests.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs", "aes-crypto"] }
rars = { version = "0.11", default-features = false, features = ["write", "encryption"] }
sevenz-rust = { version = "0.6.1", default-features = false, features = ["compress", "aes256"] }

[dev-dependencies]
tempfile = "3"
