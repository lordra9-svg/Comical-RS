name: Release

# Builds the artifacts a Linux host cannot produce and attaches them to an
# existing GitHub release. Linux is not repeated here: `cargo run -p xtask --
# release <version>` builds and `verify` checks those on any Linux machine.
#
# Windows: cross-compiled on Ubuntu, because mingw-w64 gives the link step and
# wixl builds the MSI from the same WiX source the project ships.
# macOS: built on a macOS runner, because the toolchain is not redistributable.
# Both targets are installed there, so cargo-bundle lipos one universal app.
# With a Developer ID certificate and notary credentials in the repository
# secrets, `xtask release` also signs, notarizes and staples that app; without
# them it builds an unsigned one and says so.
#
# The published SHA256SUMS.txt is rewritten at the end from the assets that are
# actually on the release, so it covers the Linux files uploaded by hand too.
#
# `ref` exists for one case: a tag cut before this workflow and before the
# macOS bundle metadata existed (v0.2.4). Building `master` for it produces the
# same binary, because that commit only adds packaging configuration, and the
# macOS app needs the metadata to exist at all. Leave it empty for new tags.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the artifacts to, for example v0.2.4"
        required: true
        type: string
      ref:
        description: "Commit or tag to build; leave empty to build the tag itself."
        required: false
        type: string
        default: ""
      macos_runner:
        description: "Runner label for the macOS job, for example macos-15-intel when macos-15 is queued."
        required: false
        type: string
        default: "macos-15"

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}

jobs:
  windows:
    name: Windows exe and MSI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wixl wixl-data gcc-mingw-w64-x86-64

      - name: Build and verify the artifacts
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          cargo run -p xtask -- release "$version"
          test -s "target/release-dist/$version/comical-windows-x86_64.exe"
          test -s "target/release-dist/$version/comical-$version-x86_64.msi"
          cargo run -p xtask -- verify "target/release-dist/$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dist="target/release-dist/$VERSION"
          gh release upload "$TAG" \
            "$dist/comical-windows-x86_64.exe" \
            "$dist/comical-$VERSION-x86_64.msi" \
            --clobber

  macos:
    name: macOS app
    # Pinned rather than `macos-latest`: the image behind the alias is retired
    # on a schedule, and a job that never gets a runner only shows up as a
    # cancellation fifteen minutes later. Both current images can build the
    # universal bundle, and the input is a way out when one pool is empty.
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    # Notarization waits on Apple, which adds minutes to an already long job.
    timeout-minutes: 60
    env:
      # Declared here so a step can branch on them: `secrets` is rejected in a
      # step-level `if`, and a missing certificate has to mean "build unsigned".
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # Pinned, because a release should not discover a new bundle layout, and
      # cached, because this install is nine minutes of every macOS run.
      - name: Cache cargo-bundle
        id: cargo-bundle
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-bundle
          key: cargo-bundle-0.12.0-${{ runner.os }}

      - name: Install cargo-bundle
        if: steps.cargo-bundle.outputs.cache-hit != 'true'
        run: cargo install cargo-bundle --locked --version 0.12.0

      # Codesign reads the identity from a keychain, so the .p12 is imported
      # into a throwaway one. Steps that follow only see the identity name.
      - name: Import the signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(.*\)"/\1/p' | head -1)
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing as $identity"

      - name: Build and verify the artifacts
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          cargo run -p xtask -- release "$version"
          # Printed so a bundle that loses its document types says what it has.
          plutil -p target/universal/release/bundle/osx/Comical.app/Contents/Info.plist || true
          test -s "target/release-dist/$version/comical-$version-macos-universal.zip"
          cargo run -p xtask -- verify "target/release-dist/$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "target/release-dist/$VERSION/comical-$VERSION-macos-universal.zip" \
            --clobber

  checksums:
    name: Rebuild SHA256SUMS.txt
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Cover every published asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          gh release download "$TAG" --clobber
          rm -f SHA256SUMS.txt
          for file in *; do
            printf '%s  ./%s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$file"
          done | sort -k2 > ../SHA256SUMS.txt
          gh release upload "$TAG" ../SHA256SUMS.txt --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
