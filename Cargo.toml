[workspace]
resolver = "3"
members = [
    "crates/comical-core",
    "crates/comical-archive",
    "crates/comical-image",
    "crates/comical-app",
    "crates/comical-cli",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/lordra9-svg/Comical-RS"

[workspace.dependencies]
comical-core = { path = "crates/comical-core" }
comical-archive = { path = "crates/comical-archive" }
thiserror = "2"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
