[package]
name = "comical-image"
description = "Image decoding and resampling for the comic viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }

# Decode only: PNG, JPEG, GIF and WebP. Encoders and other formats stay disabled.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
nom-exif = "3"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
