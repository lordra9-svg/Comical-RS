[package]
name = "comical-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop viewer GUI for Comical"
repository.workspace = true

[[bin]]
name = "comical"
path = "src/main.rs"

[dependencies]
# wgpu only, and explicitly: with the glow backend compiled in, eframe picks
# OpenGL at runtime, which the wgpu feature was meant to replace.
eframe = { version = "0.31", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
egui = "0.31"
rfd = "0.17"
thiserror = "2"
lru = "0.19"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
comical-core = { workspace = true }
comical-archive = { workspace = true }
comical-image = { path = "../comical-image" }
crossbeam-channel = "0.5"
rayon = "1"

[package.metadata.deb]
maintainer = "Comical-RS Contributors"
copyright = "2024–2026 Comical-RS Contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Comical is a desktop comic book reader supporting CBZ, CBR and 7z archives.
Features include one-page, two-page and webtoon view modes, EXIF orientation,
per-page rotation, RTL reading, byte-budgeted caches, parallel prefetch and
persistent settings."""
depends = "$auto"
section = "graphics"
priority = "optional"
assets = [
    ["target/release/comical", "usr/bin/", "755"],
    ["../../CHANGELOG.md", "usr/share/doc/comical/", "644"],
    ["../../README.md", "usr/share/doc/comical/", "644"],
]

# `cargo bundle` reads this for the macOS `.app`. The icon is the same
# placeholder as the Windows one, so it is capped at 256 px. The document types
# in the plist extension mirror the WiX file associations, since a bundle has no
# installer to register extensions for it.
[package.metadata.bundle]
name = "Comical"
identifier = "io.github.lordra9-svg.comical"
icon = ["assets/comical.ico"]
category = "public.app-category.entertainment"
short_description = "Desktop comic book reader"
long_description = """\
Comical reads CBZ, CBR and 7z comic archives with one-page, two-page and
webtoon view modes, EXIF orientation, per-page rotation and RTL reading."""
copyright = "2024-2026 Comical-RS Contributors"

[package.metadata.bundle.osx]
# 10.15 is the oldest release eframe and wgpu still support.
minimum_system_version = "10.15"
info_plist_exts = ["assets/macos-document-types.plist"]

# eframe's wgpu integration turns wgpu's default features off, which also drops
# wgpu's `dx12` backend, so Windows would be left with Vulkan and GLES only.
# Named here purely to enable that backend; the app never calls wgpu directly.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "24", default-features = false, features = ["dx12"] }

[build-dependencies]
# Emits the .rsrc section: icon, VERSIONINFO and manifest. Windows targets only.
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
xtask = { path = "../../xtask" }
