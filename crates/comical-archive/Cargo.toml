[package]
name = "comical-archive"
description = "Read-only archive access for the comic viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
comical-core = { workspace = true }
thiserror = { workspace = true }

# Reader only: no recovery, parallel or optional compressor features beyond
# what encryption requires. Encryption is enabled because the behavior spec
# requires encrypted archives.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs", "aes-crypto"] }
rars = { version = "0.11", default-features = false, features = ["encryption"] }
# sevenz-rust2 is the maintained fork of the abandoned sevenz-rust. The reader
# needs no compressor: aes256 pulls only the AES, CBC and key-derivation crates,
# and decompression is unconditional.
sevenz-rust2 = { version = "0.20.2", default-features = false, features = ["aes256"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
xtask = { path = "../../xtask" }
